<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIA Auto IP</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="profile-float.css">
  <link rel="stylesheet" href="interaction-v2.css">
  <style>
    .workspace:has(#ip-chat-panel.hidden) { grid-template-columns:minmax(0,1fr); }
    .workspace:has(#ip-chat-panel.hidden) .profile-panel { display:none; }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="identity-screen" class="identity-screen">
      <div class="brand">AIA Auto IP <span>内部工具</span></div>
      <div class="identity-logo-lockup">
        <p class="identity-slogan">让卓越的你，被更多人看见！</p>
      </div>
      <div class="identity-card">
        <p class="eyebrow">开始创建你的账号人设</p>
        <h1>先找到你的已有资料</h1>
        <p class="muted">输入姓名和营销员编号后，我们会带入你此前填写的报名资料。</p>
        <form id="lookup-form">
          <label>姓名<input id="name-input" required placeholder="例如：张三"></label>
          <label>营销员编号<input id="agent-id-input" required placeholder="请输入编号"></label>
          <button class="primary" type="submit">匹配我的资料</button>
        </form>
        <button id="guest-start" class="text-button">我不在名单中，直接开始</button>
      </div>
    </section>

    <section id="workspace" class="workspace hidden">
      <header class="workspace-toolbar">
        <div class="toolbar-brand"><strong>AIA Auto IP</strong><span>红人计划</span></div>
        <nav id="tool-tabs" class="tool-tabs" aria-label="创作工具">
          <button class="tool-tab active" data-tool="ip" type="button"><span>✨</span>IP 人设</button>
          <button class="tool-tab" data-tool="planning" type="button"><span>🗂️</span>内容规划</button>
          <button class="tool-tab" data-tool="script" type="button"><span>✍️</span>脚本改写</button>
          <button class="tool-tab" data-tool="xhs" type="button"><span>📱</span>小红书排版</button>
        </nav>
        <div class="toolbar-account"><span id="identity-state" class="identity-state"></span><button id="switch-account" class="text-button hidden">运营测试：切换账号</button></div>
      </header>

      <section id="ip-chat-panel" class="chat-panel">
        <span id="chat-title" class="hidden" aria-hidden="true"></span>
        <header class="panel-header">
          <div class="panel-heading"><h2>IP 人设</h2><p id="chat-subtitle" class="panel-subtitle">从真实资料中，找到更像你的长期定位。</p></div>
          <span id="save-state" class="status-pill">本次会话</span>
        </header>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="quick-replies" class="quick-replies"></div>
        <form id="chat-form" class="composer">
          <input id="chat-input" autocomplete="off" placeholder="输入你的回答…">
          <button class="primary" type="submit">发送</button>
        </form>
      </section>

      <section id="planning-panel" class="chat-panel planning-panel hidden">
        <header class="panel-header">
          <div class="panel-heading"><h2>账号内容规划</h2><p id="planning-subtitle" class="panel-subtitle">结合你的 IP，确定稳定、聚焦的内容方向。</p></div>
          <div class="panel-header-actions"><span id="planning-save-state" class="status-pill">本次会话</span><button id="view-content-plan" class="secondary-button hidden" type="button">查看最新方案</button></div>
        </header>
        <div id="planning-messages" class="messages" aria-live="polite"></div>
        <div id="planning-quick-replies" class="quick-replies"></div>
        <form id="planning-form" class="composer">
          <input id="planning-input" autocomplete="off" placeholder="输入你的回答…">
          <button class="primary" type="submit">发送</button>
        </form>
      </section>

      <section id="script-panel" class="chat-panel creative-panel hidden">
        <header class="panel-header">
          <div class="panel-heading"><h2>智能脚本改写</h2><p id="script-subtitle" class="panel-subtitle">结合您的IP，智能脚本改写！</p></div>
          <span id="script-save-state" class="status-pill">本次会话</span>
        </header>
        <div id="script-messages" class="messages" aria-live="polite"></div>
        <form id="script-form" class="composer creative-composer">
          <textarea id="script-input" placeholder="粘贴需要改写的原脚本…"></textarea>
          <button class="primary" type="submit">开始改写</button>
        </form>
      </section>

      <section id="xhs-panel" class="chat-panel creative-panel hidden">
        <header class="panel-header">
          <div class="panel-heading"><h2>小红书排版</h2><p id="xhs-subtitle" class="panel-subtitle">不改一个字，让每一个重点更容易被看见。</p></div>
          <span id="xhs-save-state" class="status-pill">本次会话</span>
        </header>
        <div id="xhs-messages" class="messages" aria-live="polite"></div>
        <form id="xhs-form" class="composer creative-composer">
          <textarea id="xhs-input" placeholder="粘贴需要排版的原文…"></textarea>
          <button class="primary" type="submit">开始排版</button>
        </form>
      </section>

      <section id="tool-placeholder" class="tool-placeholder hidden" aria-live="polite"></section>

      <aside class="profile-panel">
        <div class="profile-title"><div><p class="eyebrow">当前创作上下文</p><h2>我的 IP 信息</h2></div><span id="completion">0%</span></div>
        <div id="profile-card" class="profile-card"></div>
        <button id="generate-button" class="primary full-width" disabled>确认资料，生成方案</button>
        <button id="view-proposal" class="secondary-button full-width hidden" type="button">查看最新方案</button>
      </aside>
    </section>

    <section id="proposal-screen" class="proposal-screen hidden" aria-label="IP 方案预览">
      <header class="proposal-header">
        <div><p class="eyebrow">AIA Auto IP</p><h2>方案预览</h2></div>
        <div class="proposal-header-actions"><span id="proposal-version" class="status-pill"></span><button id="proposal-close" class="secondary-button" type="button">返回对话</button></div>
      </header>
      <main id="proposal-content" class="proposal-content"></main>
    </section>

    <section id="content-plan-screen" class="proposal-screen content-plan-screen hidden" aria-label="内容规划方案预览">
      <header class="proposal-header">
        <div><p class="eyebrow">账号内容规划</p><h2>内容规划方案</h2></div>
        <div class="proposal-header-actions"><span id="content-plan-version" class="status-pill"></span><button id="content-plan-close" class="secondary-button" type="button">返回对话</button></div>
      </header>
      <main id="content-plan-content" class="proposal-content"></main>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="onboarding.js"></script>
  <script src="profile-float.js"></script>
  <script src="interaction-v2.js"></script>
  <script src="composer-submit-v2.js"></script>
</body>
</html>
