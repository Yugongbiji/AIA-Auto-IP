name: Frontend QA

# Long-term rule: development commits do not consume GitHub-hosted minutes.
# Full hosted QA is a final gate only: manual when needed, and once after main changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: aia-auto-ip-frontend-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend unit tests
        run: |
          python -m unittest tests/test_script_recommendation.py
          python -m unittest tests/backend/test_script_library_store.py
          python -m unittest tests/backend/test_script_api.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright QA
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
