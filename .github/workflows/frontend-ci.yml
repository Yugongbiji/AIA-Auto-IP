name: Frontend QA

# Long-term rule: development commits do not consume GitHub-hosted minutes.
# Full hosted QA is a final gate only: manual when needed, and once after main changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/aia-harness-stability-20260901

concurrency:
  group: aia-auto-ip-frontend-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python QA dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run contract and API tests
        run: |
          python -m pytest -q

  playwright:
    needs: contract-api
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-360
          - mobile-390
          - desktop-chromium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright QA
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 3
