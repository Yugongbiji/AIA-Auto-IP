name: Preview Environment Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/preview-diagnostic.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ECS environment (read only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            echo '=== identity ==='
            whoami
            id
            echo '=== app directories ==='
            ls -ld /opt/AIA-Auto-IP /opt/AIA-Auto-IP-preview 2>/dev/null || true
            echo '=== app services ==='
            systemctl status aia-auto-ip --no-pager -l 2>/dev/null | sed -n '1,16p' || true
            systemctl status aia-auto-ip-preview --no-pager -l 2>/dev/null | sed -n '1,16p' || true
            echo '=== nginx loaded files that reference 8000 ==='
            grep -Rsn '127.0.0.1:8000' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
            echo '=== nginx candidate file contents ==='
            for f in $(grep -Rsl '127.0.0.1:8000' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null); do
              real=$(readlink -f "$f")
              echo "--- $f -> $real ---"
              sed -n '1,220p' "$real" || true
            done
            echo '=== nginx effective server/location summary ==='
            nginx -T 2>/dev/null | grep -nE 'configuration file|listen |server_name|location |proxy_pass' | head -180 || true
            echo '=== direct local probes ==='
            curl -sS -o /dev/null -w '8000 root: %{http_code}\n' http://127.0.0.1:8000/ || true
            curl -sS -o /dev/null -w '8001 root: %{http_code}\n' http://127.0.0.1:8001/ || true
            curl -sS -o /dev/null -w 'nginx root: %{http_code}\n' http://127.0.0.1/ || true
            curl -sS -o /dev/null -w 'nginx preview: %{http_code}\n' http://127.0.0.1/preview/ || true
            echo '=== listening ports ==='
            ss -lntp 2>/dev/null | grep -E ':80 |:8000 |:8001 ' || true
            echo '=== production repo state ==='
            git -C /opt/AIA-Auto-IP rev-parse --abbrev-ref HEAD 2>/dev/null || true
            git -C /opt/AIA-Auto-IP rev-parse --short HEAD 2>/dev/null || true
            echo '=== done: no changes were made ==='
