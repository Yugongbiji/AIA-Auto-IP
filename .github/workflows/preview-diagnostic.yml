name: Preview Environment Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/preview-diagnostic.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ECS environment for Housing onboarding (read only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo '=== identity ==='
            whoami
            hostname
            uname -sr
            echo '=== capacity ==='
            df -h /
            free -h
            echo '=== known project roots ==='
            ls -ld /opt/AIA-Auto-IP /opt/Yugong-Housing-Market-Tracker 2>/dev/null || true
            echo '=== relevant systemd unit names ==='
            systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei 'aia|housing|yugong|nginx' || true
            echo '=== AIA service state ==='
            systemctl is-active aia-auto-ip 2>/dev/null || true
            echo '=== listening addresses ==='
            ss -ltnH 2>/dev/null | awk '{print $4}' | sort -u
            echo '=== requested port checks ==='
            for port in 8000 8002 8100 8102; do
              if ss -ltnH 2>/dev/null | awk '{print $4}' | grep -Eq "(^|:)${port}$"; then
                echo "port_${port}=LISTENING"
              else
                echo "port_${port}=FREE"
              fi
            done
            echo '=== nginx references to known app ports ==='
            nginx -T 2>/dev/null | grep -nE '127\.0\.0\.1:(8000|8002|8100|8102)|proxy_pass' | head -120 || true
            echo '=== done: no changes were made ==='
