name: ECS Deployment Safety Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/preview-diagnostic.yml'
      - '.github/workflows/ecs-safety-tests.yml'
      - 'tests/test_ecs_deploy_safety_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate ECS workflow safety without server secrets
        run: python3 -m unittest discover -s tests -p test_ecs_deploy_safety_contract.py -v
