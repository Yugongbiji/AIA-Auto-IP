# Preview is intentionally isolated from production: separate checkout, service, port and SQLite user data.
# Long-term rule: do not deploy Preview on every PR commit. Trigger only at a natural stage-validation point.
name: Deploy Preview
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Development branch to deploy to Preview
        required: true
        default: agent/ip-product-optimization-20260821
concurrency:
  group: aia-auto-ip-preview
  cancel-in-progress: true
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy isolated Preview to ECS
        uses: appleboy/ssh-action@v1
        env:
          AIA_RDS_HOST: ${{ secrets.AIA_RDS_HOST }}
          AIA_RDS_PORT: ${{ secrets.AIA_RDS_PORT }}
          AIA_RDS_NAME: ${{ secrets.AIA_RDS_NAME }}
          AIA_RDS_USER: ${{ secrets.AIA_RDS_USER }}
          AIA_RDS_PASSWORD: ${{ secrets.AIA_RDS_PASSWORD }}
          AIA_RDS_SSLMODE: ${{ secrets.AIA_RDS_SSLMODE }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: AIA_RDS_HOST,AIA_RDS_PORT,AIA_RDS_NAME,AIA_RDS_USER,AIA_RDS_PASSWORD,AIA_RDS_SSLMODE
          script: |
            set -euo pipefail
            PREVIEW_DIR=/opt/AIA-Auto-IP-preview
            PROD_DIR=/opt/AIA-Auto-IP
            PREVIEW_BRANCH="${{ inputs.branch }}"
            PREVIEW_SERVICE=/etc/systemd/system/aia-auto-ip-preview.service
            [ -n "$PREVIEW_BRANCH" ]
            systemctl is-active --quiet aia-auto-ip
            curl -fsS --retry 3 http://127.0.0.1:8000/ >/dev/null
            if [ ! -d "$PREVIEW_DIR/.git" ]; then ORIGIN_URL=$(git -C "$PROD_DIR" remote get-url origin); git clone "$ORIGIN_URL" "$PREVIEW_DIR"; fi
            git -C "$PREVIEW_DIR" fetch origin "$PREVIEW_BRANCH"
            git -C "$PREVIEW_DIR" checkout -B "$PREVIEW_BRANCH" "origin/$PREVIEW_BRANCH"
            git -C "$PREVIEW_DIR" reset --hard "origin/$PREVIEW_BRANCH"
            if [ ! -x "$PREVIEW_DIR/.venv/bin/python" ]; then python3 -m venv "$PREVIEW_DIR/.venv"; fi
            "$PREVIEW_DIR/.venv/bin/pip" install -r "$PREVIEW_DIR/requirements.txt"
            : > "$PREVIEW_DIR/.env"
            for SRC in "$PROD_DIR/.env" "$PROD_DIR/.env.rds"; do if [ -f "$SRC" ]; then grep -E '^(DEEPSEEK_API_KEY|DEEPSEEK_MODEL)=' "$SRC" >> "$PREVIEW_DIR/.env" || true; fi; done
            printf '\nDB_ENGINE=sqlite\n' >> "$PREVIEW_DIR/.env"
            rm -f "$PREVIEW_DIR/.env.rds"
            grep -q '^DEEPSEEK_API_KEY=' "$PREVIEW_DIR/.env"
            cd "$PREVIEW_DIR"
            "$PREVIEW_DIR/.venv/bin/python" - "$PROD_DIR" <<'PY'
            from pathlib import Path
            import json, os, sqlite3, subprocess, sys
            import psycopg
            from psycopg.rows import dict_row
            import server, script_library_store
            prod_dir=Path(sys.argv[1])
            def envfile(p):
                out={}
                if p.exists():
                    for raw in p.read_text(encoding='utf-8').splitlines():
                        s=raw.strip()
                        if s and not s.startswith('#') and '=' in s:
                            k,v=s.split('=',1); out[k.strip()]=v.strip().strip('"').strip("'")
                return out
            prod={}; prod.update(envfile(prod_dir/'.env')); prod.update(envfile(prod_dir/'.env.rds'))
            mapping={'DB_HOST':'AIA_RDS_HOST','DB_PORT':'AIA_RDS_PORT','DB_NAME':'AIA_RDS_NAME','DB_USER':'AIA_RDS_USER','DB_PASSWORD':'AIA_RDS_PASSWORD','DB_SSLMODE':'AIA_RDS_SSLMODE'}
            for k,s in mapping.items():
                if os.getenv(s,'').strip(): prod[k]=os.getenv(s).strip()
            missing=[k for k in ['DB_HOST','DB_NAME','DB_USER','DB_PASSWORD'] if not prod.get(k)]
            if missing: raise SystemExit('Preview baseline blocked: missing '+','.join(missing))
            args=dict(host=prod['DB_HOST'],port=int(prod.get('DB_PORT','5432')),dbname=prod['DB_NAME'],user=prod['DB_USER'],password=prod['DB_PASSWORD'],sslmode=prod.get('DB_SSLMODE','prefer') or 'prefer',row_factory=dict_row)
            with psycopg.connect(**args) as pg:
                scripts=[dict(r) for r in pg.execute("SELECT batch,level1_tag,level2_tag,title_1,title_2,title_3,body,word_count,estimated_minutes,is_hot,reviewed_at,status,content_hash FROM public.script_library WHERE status='active' ORDER BY script_id").fetchall()]
                agents=[dict(r) for r in pg.execute('SELECT agent_id,name,survey_json,imported_at FROM public.agents ORDER BY agent_id').fetchall()]
                profiles=[dict(r) for r in pg.execute('SELECT agent_id,profile_json,updated_at FROM public.saved_profiles ORDER BY agent_id').fetchall()]
                reviews=[dict(r) for r in pg.execute('SELECT agent_id,reviewer_nickname,relationship,traits,topics,roles,intro,imported_at FROM public.peer_reviews ORDER BY id').fetchall()]
            if not scripts or not agents: raise SystemExit('Production baseline unexpectedly empty')
            server.load_local_env()
            if server.database_engine()!='sqlite': raise SystemExit('Preview safety guard failed')
            server.initialize_database(); script_library_store.initialize_script_library(server.database,server.database_engine); script_library_store.upsert_scripts(server.database,scripts)
            with sqlite3.connect(server.DB_PATH) as db:
                db.execute('PRAGMA foreign_keys=ON')
                db.execute('''CREATE TABLE IF NOT EXISTS peer_reviews (id INTEGER PRIMARY KEY AUTOINCREMENT, agent_id TEXT NOT NULL, reviewer_nickname TEXT, relationship TEXT, traits TEXT, topics TEXT, roles TEXT, intro TEXT, imported_at TEXT NOT NULL, FOREIGN KEY(agent_id) REFERENCES agents(agent_id))''')
                db.execute('CREATE INDEX IF NOT EXISTS idx_peer_reviews_agent_id ON peer_reviews(agent_id)')
                for r in agents:
                    db.execute('''INSERT INTO agents(agent_id,name,survey_json,imported_at) VALUES(?,?,?,?) ON CONFLICT(agent_id) DO UPDATE SET name=excluded.name,survey_json=excluded.survey_json,imported_at=excluded.imported_at''',(str(r['agent_id']),r['name'],r['survey_json'] if isinstance(r['survey_json'],str) else json.dumps(r['survey_json'] or {},ensure_ascii=False),str(r['imported_at'])))
                for r in profiles:
                    db.execute('''INSERT INTO saved_profiles(agent_id,profile_json,updated_at) VALUES(?,?,?) ON CONFLICT(agent_id) DO UPDATE SET profile_json=excluded.profile_json,updated_at=excluded.updated_at''',(str(r['agent_id']),r['profile_json'] if isinstance(r['profile_json'],str) else json.dumps(r['profile_json'] or {},ensure_ascii=False),str(r['updated_at'])))
                db.execute('DELETE FROM peer_reviews')
                for r in reviews:
                    db.execute('INSERT INTO peer_reviews(agent_id,reviewer_nickname,relationship,traits,topics,roles,intro,imported_at) VALUES(?,?,?,?,?,?,?,?)',(str(r['agent_id']),r['reviewer_nickname'],r['relationship'],r['traits'],r['topics'],r['roles'],r['intro'],str(r['imported_at'])))
                db.commit()
            print(f'Preview baseline ready: scripts={len(scripts)}, agents={len(agents)}, profiles={len(profiles)}, peer_reviews={len(reviews)}')
            PY
            cat > "$PREVIEW_SERVICE" <<'UNIT'
            [Unit]
            Description=AIA Auto IP Preview
            After=network.target
            [Service]
            Type=simple
            WorkingDirectory=/opt/AIA-Auto-IP-preview
            ExecStart=/opt/AIA-Auto-IP-preview/.venv/bin/python /opt/AIA-Auto-IP-preview/script_server.py --port 8001
            Restart=on-failure
            RestartSec=2
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload; systemctl enable aia-auto-ip-preview >/dev/null; systemctl restart aia-auto-ip-preview; sleep 2
            systemctl is-active --quiet aia-auto-ip-preview
            curl -fsS --retry 5 --retry-delay 1 http://127.0.0.1:8001/ >/dev/null
            PROD_NGINX=$(grep -Rsl 'proxy_pass http://127.0.0.1:8000' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -1 || true); [ -n "$PROD_NGINX" ]; PROD_NGINX=$(readlink -f "$PROD_NGINX")
            NGINX_BACKUP="${PROD_NGINX}.preview-backup"; cp "$PROD_NGINX" "$NGINX_BACKUP"
            rollback(){ cp "$NGINX_BACKUP" "$PROD_NGINX"; nginx -t; systemctl reload nginx; }
            python3 - "$PROD_NGINX" <<'PY'
            from pathlib import Path
            import re,sys
            p=Path(sys.argv[1]); t=p.read_text(); b='    # AIA_PREVIEW_BEGIN\n'; e='    # AIA_PREVIEW_END\n'
            block='''    # AIA_PREVIEW_BEGIN
                location = /preview { return 302 /preview/; }
                location /preview/ {
                    proxy_pass http://127.0.0.1:8001/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Accept-Encoding "";
                    sub_filter_once off;
                    sub_filter_types text/javascript application/javascript;
                    sub_filter "fetch('/api/" "fetch('/preview/api/";
                    add_header X-AIA-Environment preview always;
                }
                # AIA_PREVIEW_END
            '''
            if b in t and e in t: t=re.sub(re.escape(b)+r'.*?'+re.escape(e),block,t,count=1,flags=re.S)
            else:
                pos=t.find('proxy_pass http://127.0.0.1:8000'); ms=list(re.finditer(r'(?m)^\s*location\s+/\s*\{',t[:pos])); t=t[:ms[-1].start()]+block+t[ms[-1].start():]
            p.write_text(t)
            PY
            nginx -t || { rollback; exit 1; }; systemctl reload nginx; sleep 2
            curl -fsS --retry 8 --retry-delay 1 http://127.0.0.1/preview/ >/dev/null || { rollback; exit 1; }
            curl -fsS --retry 5 http://127.0.0.1/ >/dev/null || { rollback; exit 1; }
            systemctl is-active --quiet aia-auto-ip || { rollback; exit 1; }
            echo "Preview healthy; branch=${PREVIEW_BRANCH}; commit=$(git -C "$PREVIEW_DIR" rev-parse --short HEAD)"
