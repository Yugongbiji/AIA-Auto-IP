name: Deploy Preview

on:
  push:
    branches:
      - agent/frontend-engineering-v1

concurrency:
  group: aia-auto-ip-preview
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright QA
        run: npm run test:e2e

  deploy-preview:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy isolated Preview to ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -euo pipefail

            PREVIEW_DIR=/opt/AIA-Auto-IP-preview
            PROD_DIR=/opt/AIA-Auto-IP
            PREVIEW_BRANCH=agent/frontend-engineering-v1
            PREVIEW_SERVICE=/etc/systemd/system/aia-auto-ip-preview.service
            NGINX_FILE=/etc/nginx/conf.d/aia-auto-ip-preview.conf
            PREVIEW_HOST='${{ secrets.ECS_HOST }}'

            echo '=== 1. Guard production before Preview changes ==='
            systemctl is-active --quiet aia-auto-ip
            curl -fsS --retry 3 http://127.0.0.1:8000/ >/dev/null

            echo '=== 2. Prepare isolated Preview checkout ==='
            if [ ! -d "$PREVIEW_DIR/.git" ]; then
              ORIGIN_URL=$(git -C "$PROD_DIR" remote get-url origin)
              git clone "$ORIGIN_URL" "$PREVIEW_DIR"
            fi
            git -C "$PREVIEW_DIR" fetch origin "$PREVIEW_BRANCH"
            git -C "$PREVIEW_DIR" checkout -B "$PREVIEW_BRANCH" "origin/$PREVIEW_BRANCH"
            git -C "$PREVIEW_DIR" reset --hard "origin/$PREVIEW_BRANCH"

            echo '=== 3. Prepare Preview Python environment ==='
            if [ ! -x "$PREVIEW_DIR/.venv/bin/python" ]; then
              python3 -m venv "$PREVIEW_DIR/.venv"
            fi
            "$PREVIEW_DIR/.venv/bin/pip" install -r "$PREVIEW_DIR/requirements.txt"

            # Preview may reuse only the DeepSeek credential/model from the server.
            # It MUST NOT inherit the production RDS connection.
            : > "$PREVIEW_DIR/.env"
            for SRC in "$PROD_DIR/.env" "$PROD_DIR/.env.rds"; do
              if [ -f "$SRC" ]; then
                grep -E '^(DEEPSEEK_API_KEY|DEEPSEEK_MODEL)=' "$SRC" >> "$PREVIEW_DIR/.env" || true
              fi
            done
            printf '\nDB_ENGINE=sqlite\n' >> "$PREVIEW_DIR/.env"
            rm -f "$PREVIEW_DIR/.env.rds"
            if ! grep -q '^DEEPSEEK_API_KEY=' "$PREVIEW_DIR/.env"; then
              echo 'Preview setup stopped: DeepSeek key was not found in the existing server env.' >&2
              exit 1
            fi

            echo '=== 4. Initialize isolated Preview data when needed ==='
            if [ ! -f "$PREVIEW_DIR/data/persona.sqlite3" ]; then
              cd "$PREVIEW_DIR"
              "$PREVIEW_DIR/.venv/bin/python" server.py --import-xlsx 'data/何不团队报名表20260807.xlsx'
            fi

            echo '=== 5. Install/start independent Preview service on 127.0.0.1:8001 ==='
            cat > "$PREVIEW_SERVICE" <<'UNIT'
            [Unit]
            Description=AIA Auto IP Preview
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/AIA-Auto-IP-preview
            ExecStart=/opt/AIA-Auto-IP-preview/.venv/bin/python /opt/AIA-Auto-IP-preview/server.py --port 8001
            Restart=on-failure
            RestartSec=2

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable aia-auto-ip-preview >/dev/null
            systemctl restart aia-auto-ip-preview
            sleep 2
            systemctl is-active --quiet aia-auto-ip-preview
            curl -fsS --retry 5 --retry-delay 1 http://127.0.0.1:8001/ >/dev/null

            echo '=== 6. Add same-IP /preview route without opening a new public port ==='
            NGINX_BACKUP="${NGINX_FILE}.previous"
            if [ -f "$NGINX_FILE" ]; then cp "$NGINX_FILE" "$NGINX_BACKUP"; else rm -f "$NGINX_BACKUP"; fi

            cat > "$NGINX_FILE" <<EOF
            server {
                listen 80;
                server_name ${PREVIEW_HOST};

                location = /preview {
                    return 302 /preview/;
                }

                location /preview/ {
                    proxy_pass http://127.0.0.1:8001/;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    add_header X-AIA-Environment preview always;
                }

                # The browser code currently calls absolute /api/* URLs.
                # Requests originating from /preview/ are routed to 8001;
                # all normal production API traffic stays on 8000.
                location /api/ {
                    set \$aia_backend http://127.0.0.1:8000;
                    if (\$http_referer ~* "^https?://[^/]+/preview/") {
                        set \$aia_backend http://127.0.0.1:8001;
                    }
                    proxy_pass \$aia_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            EOF

            if ! nginx -t; then
              echo 'Nginx Preview config invalid; restoring previous config.' >&2
              if [ -f "$NGINX_BACKUP" ]; then mv "$NGINX_BACKUP" "$NGINX_FILE"; else rm -f "$NGINX_FILE"; fi
              nginx -t
              exit 1
            fi
            systemctl reload nginx

            echo '=== 7. Verify Preview AND production after routing change ==='
            if ! curl -fsS --retry 5 --retry-delay 1 -H "Host: $PREVIEW_HOST" http://127.0.0.1/preview/ >/dev/null; then
              echo 'Preview route failed; rolling back only the Preview nginx config.' >&2
              if [ -f "$NGINX_BACKUP" ]; then mv "$NGINX_BACKUP" "$NGINX_FILE"; else rm -f "$NGINX_FILE"; fi
              nginx -t && systemctl reload nginx
              exit 1
            fi
            curl -fsS --retry 5 --retry-delay 1 -H "Host: $PREVIEW_HOST" http://127.0.0.1/ >/dev/null
            systemctl is-active --quiet aia-auto-ip
            curl -fsS --retry 3 http://127.0.0.1:8000/ >/dev/null

            echo "Preview healthy at /preview/; commit: $(git -C "$PREVIEW_DIR" rev-parse --short HEAD)"
