name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Alibaba Cloud ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/AIA-Auto-IP
            PREVIOUS_COMMIT=$(git rev-parse HEAD)

            rollback() {
              echo "Production frontend deployment failed. Restoring ${PREVIOUS_COMMIT}."
              git reset --hard "$PREVIOUS_COMMIT"
              /opt/AIA-Auto-IP/.venv/bin/pip install -r requirements.txt
              systemctl restart aia-auto-ip
              systemctl is-active --quiet aia-auto-ip
              curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8000/ >/dev/null
              exit 1
            }

            git fetch origin main
            git reset --hard origin/main
            /opt/AIA-Auto-IP/.venv/bin/pip install -r requirements.txt

            OVERRIDE=/etc/systemd/system/aia-auto-ip.service.d/10-script-server.conf
            rm -f "$OVERRIDE"
            systemctl daemon-reload
            systemctl restart aia-auto-ip

            if ! systemctl is-active --quiet aia-auto-ip \
              || ! curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8000/ >/dev/null \
              || ! curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8000/ | grep -q '脚本推荐'; then
              rollback
            fi

            echo "Frontend deployment healthy: $(git rev-parse --short HEAD)"
